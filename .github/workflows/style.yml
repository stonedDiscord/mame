name: Style Check

on:
  pull_request:
    paths:
    - '.github/workflows/**'
    - 'src/**.cpp'
    - 'src/**.h'

jobs:
  stylecheck:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        run: echo "changed_files=$(git diff --name-only --diff-filter=ACMRT ${{ github.event.pull_request.base.sha }}...HEAD | xargs)" >> $GITHUB_OUTPUT

      - name: Run style check
        id: style-check
        run: echo "reviews=$(python3 scripts/build/style.py ${{ steps.changed-files.outputs.changed_files }} | jq -s -c .)" >> $GITHUB_OUTPUT

      - name: Post review comments
        uses: actions/github-script@v8
        id: post-comments
        env:
          REVIEWS: ${{ steps.style-check.outputs.reviews }}
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const reviews = JSON.parse(process.env.REVIEWS || "[]");
            const pr = context.payload.pull_request;

            for (const review of reviews) {
              try {
                await github.rest.pulls.createReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  body: review.body,
                  path: review.path,
                  line: review.line,
                  side: "RIGHT"
                });
              } catch (err) {
                console.error(`Failed to comment on ${review.path}:${review.line}:`, err);
              }
            }
