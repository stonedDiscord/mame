name: Style Check

on:
  pull_request:
    paths:
    - '.github/workflows/**'
    - 'src/**.cpp'
    - 'src/**.h'

jobs:
  stylecheck:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        run: echo "changed_files=$(git diff --name-only --diff-filter=ACMRT ${{ github.event.pull_request.base.sha }}...HEAD | xargs)" >> $GITHUB_OUTPUT

      - name: Run style check
        id: style-check
        run: echo "reviews=$(python3 scripts/build/style.py ${{ steps.changed-files.outputs.changed_files }} | jq -s -c .)" >> $GITHUB_OUTPUT

      - name: Post review comments
        uses: actions/github-script@v8
        id: post-comments
        env:
          REVIEWS: ${{ steps.style-check.outputs.reviews }}
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const reviews = JSON.parse(process.env.REVIEWS || "[]");

            const prFiles = await github.paginate(
              github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100
              }
            );

            // Build a map: { "path/to/file": Set([changed line numbers]) }
            const changedLinesByFile = {};
            for (const file of prFiles) {
              const patch = file.patch;
              if (!patch) continue;
              const changedLines = new Set();
              let currentLine = 0;
              patch.split('\n').forEach(line => {
                // Parse unified diff hunks
                const match = /^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@/.exec(line);
                if (match) {
                  currentLine = parseInt(match[1], 10);
                  return;
                }
                if (line.startsWith('+') && !line.startsWith('+++')) {
                  changedLines.add(currentLine);
                  currentLine++;
                } else if (!line.startsWith('-')) {
                  currentLine++;
                }
              });
              changedLinesByFile[file.filename] = changedLines;
            }

            // Filter reviews to only changed lines
            const comments = reviews.filter(r => {
              const changed = changedLinesByFile[r.path];
              return changed && changed.has(r.line);
            }).map(r => ({
              path: r.path,
              line: r.line,
              side: "RIGHT",
              body: r.body
            }));

            if (comments.length > 0) {
              console.debug("Filtered Reviews: ", comments);
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                event: "COMMENT",
                comments,
              });
            }